schema_version: 1
questions:
  - id: c4-svt-la-digestion-q0001
    concept_id: "organisation-appareil-digestif"
    reperes_level: "5eme"
    difficulty: "facile"
    question: "Parmi les listes suivantes, laquelle indique dans le bon ordre uniquement des organes **traversés par les aliments** dans le tube digestif ?"
    choices:
      - "Bouche -> trachée -> estomac -> foie -> gros intestin."
      - "Bouche -> œsophage -> estomac -> intestin grêle -> gros intestin."
      - "Bouche -> œsophage -> pancréas -> reins -> vessie."
      - "Bouche -> estomac -> vésicule biliaire -> gros intestin -> intestin grêle."
    answer_index: 1
    explanation: "La trachée appartient à l'appareil respiratoire, les reins à l'appareil urinaire, et le foie ainsi que le pancréas sont des glandes annexes non traversées par les aliments."

  - id: c4-svt-la-digestion-q0002
    concept_id: "organisation-appareil-digestif"
    reperes_level: "5eme"
    difficulty: "moyen"
    question: "Sur ce schéma de l'appareil digestif, quel est le rôle des glandes désignées par **`?`** au niveau de la bouche ?"
    choices:
      - "Sécréter la salive qui humidifie les aliments et commence leur digestion chimique."
      - "Fabriquer la bile destinée à digérer les graisses dans l'estomac."
      - "Absorber directement tous les nutriments vers le cœur."
      - "Filtrer le dioxygène de l'air inspiré."
    answer_index: 0
    explanation: "Il s'agit des **glandes salivaires**, qui déversent la salive (contenant une enzyme digestive) dans la bouche lors de la mastication."
    asset_id: "appareil-digestif"
    asset_role: "front_occluded"
    occlusions:
      - id: "q-occ-salivaires"
        x: 2.5
        y: 7.3
        w: 26.5
        h: 3.0
        role: "target"
        badge: "?"

  - id: c4-svt-la-digestion-q0003
    concept_id: "actions-mecaniques-et-enzymes"
    reperes_level: "5eme"
    difficulty: "facile"
    question: "Quel est le rôle précis des **enzymes digestives** présentes dans la salive, le suc gastrique ou le suc pancréatique ?"
    choices:
      - "Broyer mécaniquement les aliments comme le font les dents."
      - "Transformer chimiquement de grosses structures alimentaires en nutriments simples et solubles."
      - "Transporter le dioxygène dans les globules rouges."
      - "Rendre la paroi de l'intestin totalement imperméable."
    answer_index: 1
    explanation: "Les enzymes digestives agissent chimiquement (à environ \\(37\\,^\\circ\\text{C}\\)) pour simplifier les aliments en nutriments capables de passer dans le sang."

  - id: c4-svt-la-digestion-q0004
    concept_id: "actions-mecaniques-et-enzymes"
    reperes_level: "5eme"
    difficulty: "difficile"
    question: "Au laboratoire, on place à \\(37\\,^\\circ\\text{C}\\) deux tubes contenant de l'eau et une enzyme digestive : le tube A contient un cube entier de blanc d'œuf cuit, le tube B contient la même masse finement hachée. Qu'observe-t-on après une heure ?"
    choices:
      - "Aucun des deux tubes n'est digéré car il manque la lumière solaire."
      - "Le tube A est digéré plus vite car le cube entier retient mieux la chaleur."
      - "Le tube B est digéré beaucoup plus vite car la fragmentation mécanique augmente la surface d'action des enzymes."
      - "L'eau pure sans enzyme suffit à dissoudre le blanc d'œuf cuit en quelques secondes."
    answer_index: 2
    explanation: "Cette expérience modélise l'intérêt de la mastication : en fragmentant l'aliment, l'action mécanique offre davantage de surface de contact aux enzymes digestives."

  - id: c4-svt-la-digestion-q0005
    concept_id: "aliments-et-nutriments"
    reperes_level: "5eme"
    difficulty: "facile"
    question: "Que deviennent la majorité des matières contenues dans une pomme après sa digestion complète chez un élève en bonne santé ?"
    choices:
      - "Elles ressortent intégralement par l'anus au bout de quelques heures."
      - "Elles sont transformées en nutriments qui traversent l'intestin grêle pour passer dans le sang ; seules les fibres non digérées forment les selles."
      - "Elles passent directement de l'estomac vers la vessie pour former l'urine."
      - "Elles s'accumulent définitivement dans le foie."
    answer_index: 1
    explanation: "Le tube digestif n'est pas un tuyau imperméable : l'eau et les nutriments issus de la pomme passent dans le sang au niveau de l'intestin grêle."

  - id: c4-svt-la-digestion-q0006
    concept_id: "aliments-et-nutriments"
    reperes_level: "5eme"
    difficulty: "moyen"
    question: "Parmi les éléments suivants présents dans le tube digestif, lequel est déjà un **nutriment** directement utilisable par les cellules ?"
    choices:
      - "Un morceau de mie de pain riche en amidon."
      - "Le glucose dissous."
      - "Une fibre musculaire de viande."
      - "Une goutte d'huile végétale non digérée."
    answer_index: 1
    explanation: "L'amidon du pain, les protéines de la viande et les lipides de l'huile doivent d'abord être simplifiés par les enzymes, tandis que le glucose est déjà un nutriment soluble."

  - id: c4-svt-la-digestion-q0007
    concept_id: "absorption-intestinale-villosites"
    reperes_level: "5eme"
    difficulty: "facile"
    question: "Sur ce schéma du tube digestif abdominal, quel organe désigné par **`?`** possède des millions de villosités permettant le passage des nutriments dans le sang ?"
    choices:
      - "L'œsophage."
      - "L'intestin grêle."
      - "L'appendice."
      - "La trachée."
    answer_index: 1
    explanation: "Au centre de l'abdomen, l'intestin grêle assure l'absorption intestinale grâce à ses nombreux replis et villosités richement vascularisées."
    asset_id: "tube-digestif"
    asset_role: "front_occluded"
    occlusions:
      - id: "q-occ-intestin-grele"
        x: 11.8
        y: 11.3
        w: 28.6
        h: 5.5

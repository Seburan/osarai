  - id: c4-svt-la-digestion-q0008
    concept_id: "absorption-intestinale-villosites"
    reperes_level: "5eme"
    difficulty: "moyen"
    question: "Pourquoi la paroi interne de l'intestin grêle permet-elle une absorption très rapide et efficace des nutriments vers le sang ?"
    choices:
      - "Elle est lisse, très épaisse et dépourvue de vaisseaux sanguins."
      - "Ses nombreux replis et villosités offrent une grande surface, une paroi très fine et un riche réseau de capillaires sanguins."
      - "Elle est percée de larges trous laissant passer des morceaux entiers d'aliments dans les artères."
      - "Elle refoule tous les nutriments vers l'estomac."
    answer_index: 1
    explanation: "Tout comme les alvéoles pulmonaires pour le \\(\\text{O}_2\\), les villosités intestinales réunissent grande surface, finesse de paroi et riche vascularisation."

  - id: c4-svt-la-digestion-q0009
    concept_id: "role-microbiote-intestinal"
    reperes_level: "5eme"
    difficulty: "facile"
    question: "Laquelle de ces affirmations décrit correctement le **microbiote intestinal** humain ?"
    choices:
      - "C'est une maladie grave qu'il faut éliminer le plus vite possible avec des antibiotiques."
      - "C'est un ensemble de milliards de micro-organismes bénéfiques vivant dans l'intestin et participant à la digestion et à la défense de l'organisme."
      - "C'est le nom donné aux dents de sagesse qui broient les fibres végétales."
      - "C'est un suc acide fabriqué par la vésicule biliaire."
    answer_index: 1
    explanation: "Le microbiote intestinal vit en symbiose avec nous : il dégrade certaines fibres, synthétise des vitamines et empêche la prolifération de microbes pathogènes."

  - id: c4-svt-la-digestion-q0010
    concept_id: "role-microbiote-intestinal"
    reperes_level: "5eme"
    difficulty: "difficile"
    question: "Des souris élevées sans aucun microbiote intestinal (axéniques) digèrent moins bien certaines fibres végétales et tombent plus facilement malades lors d'une exposition à une bactérie pathogène. Que permet de conclure cette observation ?"
    choices:
      - "Le microbiote intestinal empêche l'absorption de l'eau dans l'estomac."
      - "Le microbiote intestinal complète l'action de nos propres enzymes digestives et contribue à la barrière de protection de l'organisme."
      - "Les souris dépourvues de microbiote n'ont plus d'intestin grêle."
      - "Tous les micro-organismes présents dans les aliments sont mortels."
    answer_index: 1
    explanation: "La comparaison avec un lot témoin prouve expérimentalement la double fonction digestive et protectrice du microbiote intestinal."

  - id: c4-svt-la-digestion-q0011
    concept_id: "besoins-et-equilibre-alimentaire"
    reperes_level: "5eme"
    difficulty: "facile"
    question: "Comment un adolescent qui pratique une séance intensive de sport doit-il adapter son alimentation par rapport à une journée sédentaire ?"
    choices:
      - "Supprimer totalement l'eau et les féculents avant et après l'effort."
      - "Augmenter son hydratation et ajuster ses apports énergétiques (notamment en glucides complexes) aux dépenses accrues de ses muscles."
      - "Ne consommer que des bonbons et des sodas toute la journée."
      - "Diviser par deux sa ration alimentaire quotidienne."
    answer_index: 1
    explanation: "L'équilibre alimentaire consiste à ajuster les apports en eau et en énergie aux besoins réels de l'organisme, qui augmentent avec l'activité physique et la croissance."

  - id: c4-svt-la-digestion-q0012
    concept_id: "besoins-et-equilibre-alimentaire"
    reperes_level: "5eme"
    difficulty: "moyen"
    question: "Dans quel but les pouvoirs publics diffusent-ils des repères nutritionnels (privilégier fruits, légumes et légumineuses, limiter les produits ultra-transformés très sucrés, gras ou salés, bouger chaque jour) ?"
    choices:
      - "Pour interdire toute consommation de pain ou de produits laitiers."
      - "Pour prévenir à l'échelle individuelle et collective les maladies liées aux déséquilibres alimentaires (obésité, diabète, maladies cardiovasculaires, caries)."
      - "Pour imposer exactement le même menu quotidien à tous les habitants quel que soit leur âge."
      - "Pour ralentir l'absorption du dioxygène dans les poumons."
    answer_index: 1
    explanation: "Les politiques de prévention nutritionnelle s'appuient sur les connaissances scientifiques pour aider chacun à couvrir ses besoins sans excès ni carence."

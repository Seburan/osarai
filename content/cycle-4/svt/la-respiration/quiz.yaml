  - id: c4-svt-la-respiration-q0007
    concept_id: "caracteristiques-surface-echange"
    reperes_level: "5eme"
    difficulty: "moyen"
    question: "Parmi les propositions suivantes, laquelle réunit exactement les **trois caractéristiques** expliquant l'efficacité des alvéoles pulmonaires ?"
    choices:
      - "Une paroi épaisse et rigide, peu de vaisseaux sanguins et un petit volume."
      - "Une grande surface totale, une paroi très fine et de nombreux capillaires sanguins."
      - "La présence d'enzymes digestives, de muscles puissants et d'anneaux de cartilage."
      - "Une température élevée, l'absence d'humidité et un stockage prolongé de l'air."
    answer_index: 1
    explanation: "Comme toute surface d'échange biologique performante, l'ensemble des alvéoles combine grande surface (\\(\\approx 75\\,\\text{m}^2\\)), finesse de paroi et riche vascularisation."

  - id: c4-svt-la-respiration-q0008
    concept_id: "caracteristiques-surface-echange"
    reperes_level: "5eme"
    difficulty: "difficile"
    question: "Chez un patient atteint d'**emphysème pulmonaire**, les parois d'un grand nombre d'alvéoles sont détruites. Quelle en est la conséquence directe à l'effort ?"
    choices:
      - "La surface totale d'échange diminue, ce qui limite le passage de \\(\\text{O}_2\\) dans le sang et provoque un essoufflement rapide."
      - "Le sang s'enrichit beaucoup plus vite en \\(\\text{O}_2\\) car les cavités pulmonaires sont plus larges."
      - "L'air inspiré passe directement dans l'estomac par l'œsophage."
      - "Les muscles cessent d'avoir besoin de dioxygène pour se contracter."
    answer_index: 0
    explanation: "La destruction des parois alvéolaires réduit drastiquement la surface de contact entre l'air et les capillaires sanguins, diminuant l'oxygénation du sang."

  - id: c4-svt-la-respiration-q0009
    concept_id: "diversite-organes-respiratoires"
    reperes_level: "5eme"
    difficulty: "facile"
    question: "Quel organe respiratoire permet à une truite de prélever le dioxygène dissous dans l'eau ?"
    choices:
      - "Des poumons alvéolaires."
      - "Des trachées ouvertes par des stigmates."
      - "Des branchies formées de filaments richement irrigués par le sang."
      - "Une vessie natatoire reliée à l'estomac."
    answer_index: 2
    explanation: "L'eau entre par la bouche du poisson et baigne les filaments branchiaux très fins et rouges (riches en capillaires), où s'effectuent les échanges gazeux."

  - id: c4-svt-la-respiration-q0010
    concept_id: "diversite-organes-respiratoires"
    reperes_level: "5eme"
    difficulty: "difficile"
    question: "Quel point commun partagent les **poumons** d'un humain, les **branchies** d'un poisson et le réseau de **trachées** d'un criquet ?"
    choices:
      - "Ils ne fonctionnent que dans l'air atmosphérique sec."
      - "Ils imposent tous que le sang transporte le dioxygène jusqu'aux cellules."
      - "Ils constituent tous une paroi très fine et étendue facilitant le prélèvement de \\(\\text{O}_2\\) dans le milieu de vie."
      - "Ils sont tous mis en mouvement par un diaphragme musculaire."
    answer_index: 2
    explanation: "Malgré des structures adaptées à l'air ou à l'eau (et l'absence de transport sanguin du \\(\\text{O}_2\\) chez l'insecte), tous reposent sur la finesse et l'étendue de la surface d'échange."

  - id: c4-svt-la-respiration-q0011
    concept_id: "sante-appareil-respiratoire"
    reperes_level: "5eme"
    difficulty: "facile"
    question: "Dans la fumée de tabac, quelle substance est principalement responsable du dépôt noirâtre sur les alvéoles et des cancers du poumon ?"
    choices:
      - "La vapeur d'eau."
      - "Le diazote."
      - "Les goudrons."
      - "Le glucose."
    answer_index: 2
    explanation: "Les goudrons issus de la combustion du tabac s'accumulent dans les bronches et les alvéoles et contiennent de nombreux composés cancérigènes."

  - id: c4-svt-la-respiration-q0012
    concept_id: "sante-appareil-respiratoire"
    reperes_level: "5eme"
    difficulty: "moyen"
    question: "Quelle mesure collective ou individuelle protège efficacement l'appareil respiratoire au quotidien ?"
    choices:
      - "Boucher les grilles d'aération du logement en hiver pour conserver la chaleur."
      - "Ne pas fumer, aérer quotidiennement les pièces et limiter les efforts intenses lors des pics de pollution atmosphérique."
      - "Pratiquer un effort intense à proximité immédiate d'un axe routier très fréquenté."
      - "Remplacer l'activité physique régulière par le tabagisme passif."
    answer_index: 1
    explanation: "L'absence de tabagisme, l'aération quotidienne des espaces clos et l'adaptation de l'activité lors des pics de pollution préservent la muqueuse bronchique et les alvéoles."

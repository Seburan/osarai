schema_version: 1
questions:
  - id: c4-svt-la-respiration-q0001
    concept_id: "besoins-cellulaires-et-effort"
    reperes_level: "5eme"
    difficulty: "facile"
    question: "Lorsque l'on compare le sang entrant dans un muscle en activité et le sang qui en ressort, on constate que le sang sortant contient :"
    choices:
      - "Moins de dioxygène (\\(\\text{O}_2\\)) et plus de dioxyde de carbone (\\(\\text{CO}_2\\))."
      - "Plus de dioxygène (\\(\\text{O}_2\\)) et moins de dioxyde de carbone (\\(\\text{CO}_2\\))."
      - "Plus de dioxygène (\\(\\text{O}_2\\)) et plus de nutriments."
      - "Exactement les mêmes quantités de \\(\\text{O}_2\\) et de \\(\\text{CO}_2\\) qu'à l'entrée."
    answer_index: 0
    explanation: "Le muscle prélève du \\(\\text{O}_2\\) et des nutriments dans le sang qui le traverse et y rejette un déchet, le \\(\\text{CO}_2\\)."

  - id: c4-svt-la-respiration-q0002
    concept_id: "besoins-cellulaires-et-effort"
    reperes_level: "5eme"
    difficulty: "moyen"
    question: "Au cours d'une course d'endurance, pourquoi le rythme respiratoire et le rythme cardiaque d'un élève augmentent-ils simultanément ?"
    choices:
      - "Pour refroidir uniquement l'air contenu dans la trachée."
      - "Pour renouveler plus vite l'air alvéolaire et accélérer le transport sanguin de \\(\\text{O}_2\\) vers les muscles."
      - "Pour permettre au sang d'absorber le diazote (\\(\\text{N}_2\\)) de l'air."
      - "Pour stocker durablement de l'air gazeux à l'intérieur des muscles."
    answer_index: 1
    explanation: "L'effort augmente les besoins musculaires : ventiler plus vite enrichit le sang en \\(\\text{O}_2\\), et un débit cardiaque accru le distribue plus rapidement."

  - id: c4-svt-la-respiration-q0003
    concept_id: "trajet-air-appareil-respiratoire"
    reperes_level: "5eme"
    difficulty: "facile"
    question: "Quel est l'ordre exact des organes traversés par l'air lors d'une inspiration chez l'être humain ?"
    choices:
      - "Nez -> œsophage -> bronches -> trachée -> alvéoles pulmonaires."
      - "Nez -> trachée -> bronchioles -> bronches -> capillaires sanguins."
      - "Nez -> trachée -> bronches -> bronchioles -> alvéoles pulmonaires."
      - "Nez -> larynx -> alvéoles pulmonaires -> bronches -> trachée."
    answer_index: 2
    explanation: "Après les fosses nasales, le pharynx et le larynx, l'air descend dans la trachée, se divise en deux bronches, puis en bronchioles jusqu'aux alvéoles."

  - id: c4-svt-la-respiration-q0004
    concept_id: "trajet-air-appareil-respiratoire"
    reperes_level: "5eme"
    difficulty: "moyen"
    question: "Sur ce schéma de l'appareil respiratoire humain, comment se nomment les petits sacs microscopiques désignés par **`?`** dans l'encart de droite ?"
    choices:
      - "Les villosités intestinales."
      - "Les branchies pulmonaires."
      - "Les bronchioles principales."
      - "Les alvéoles pulmonaires."
    answer_index: 3
    explanation: "L'encart agrandit l'extrémité d'une bronchiole terminée par un bouquet d'alvéoles pulmonaires entourées d'un filet de capillaires sanguins."
    asset_id: "appareil-respiratoire"
    asset_role: "front_occluded"
    occlusions:
      - id: "q-occ-alveoles"
        x: 83.2
        y: 28.0
        w: 14.5
        h: 3.6
        role: "target"
        badge: "?"

  - id: c4-svt-la-respiration-q0005
    concept_id: "echanges-gazeux-alveolaires"
    reperes_level: "5eme"
    difficulty: "facile"
    question: "Laquelle de ces affirmations compare correctement la composition de l'air inspiré et celle de l'air expiré ?"
    choices:
      - "L'air expiré ne contient plus du tout de dioxygène (\\(0\\,\\%\\))."
      - "L'air expiré contient moins de \\(\\text{O}_2\\) (\\(\\approx 16\\,\\%\\) contre \\(21\\,\\%\\)) et plus de \\(\\text{CO}_2\\) que l'air inspiré."
      - "L'air expiré contient beaucoup moins de diazote (\\(\\text{N}_2\\)) que l'air inspiré."
      - "L'air expiré contient davantage de \\(\\text{O}_2\\) que l'air inspiré."
    answer_index: 1
    explanation: "Une partie seulement du \\(\\text{O}_2\\) inspiré passe dans le sang (il en reste environ \\(16\\,\\%\\)), tandis que le \\(\\text{CO}_2\\) rejeté passe de \\(0,03\\,\\%\\) à environ \\(4\\,\\%\\)."

  - id: c4-svt-la-respiration-q0006
    concept_id: "echanges-gazeux-alveolaires"
    reperes_level: "5eme"
    difficulty: "moyen"
    question: "Sur ce schéma d'une alvéole pulmonaire, que représente la flèche orange dont la légende est masquée par **`?`** ?"
    choices:
      - "Le passage du dioxygène (\\(\\text{O}_2\\)) de l'air alvéolaire vers le sang du capillaire."
      - "Le passage du dioxyde de carbone (\\(\\text{CO}_2\\)) de l'alvéole vers le sang."
      - "Le passage des globules rouges du sang vers l'intérieur de l'alvéole."
      - "L'entrée de bulles de diazote (\\(\\text{N}_2\\)) dans les vaisseaux sanguins."
    answer_index: 0
    explanation: "La flèche orange part de la cavité de l'alvéole et traverse la fine paroi vers le capillaire sanguin : c'est le passage du \\(\\text{O}_2\\) dans le sang."
    asset_id: "alveoles"
    asset_role: "front_occluded"
    occlusions:
      - id: "q-occ-o2"
        x: 42.5
        y: 40.0
        w: 10.0

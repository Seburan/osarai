  - id: c4-hg-la-croissance-demographique-et-ses-effets-q0012
    concept_id: "lecture-cartes-et-indicateurs"
    reperes_level: "5eme"
    difficulty: "difficile"
    question: "Quels sont exactement les **trois critères** combinés pour calculer l'**Indice de développement humain (IDH)** d'un État ?"
    choices:
      - "La superficie du pays, son nombre de fleuves et sa température moyenne."
      - "Le niveau de vie par habitant, l'espérance de vie à la naissance et le niveau d'instruction (scolarisation)."
      - "Le nombre de médailles olympiques, le nombre d'aéroports et la taille de l'armée."
      - "Uniquement le taux de natalité et la densité de population au kilomètre carré."
    answer_index: 1
    explanation: "Créé par le PNUD (ONU), l'IDH varie de 0 (très faible) à 1 (très élevé) en associant richesse par habitant, santé et éducation."

schema_version: 1
cards:
  - id: c4-hg-la-croissance-demographique-et-ses-effets-c0001
    concept_id: "croissance-population-mondiale"
    reperes_level: "5eme"
    priority: "essentiel"
    type: "cloze"
    front: "La population mondiale a franchi le cap des {{c1::8 milliards::ordre de grandeur}} d'habitants en 2022 et devrait approcher {{c2::9,6 à 10 milliards::ordre de grandeur}} vers 2050 selon l'ONU."
    back: ""

  - id: c4-hg-la-croissance-demographique-et-ses-effets-c0002
    concept_id: "croissance-population-mondiale"
    reperes_level: "5eme"
    priority: "essentiel"
    type: "basic"
    front: "Comment définit-on l'**accroissement naturel** (ou solde naturel) d'une population sur une année ?"
    back: "C'est la **différence entre le nombre de naissances et le nombre de décès** enregistrés sur un territoire pendant une année (\\(\\text{Naissances} - \\text{Décès}\\))."

  - id: c4-hg-la-croissance-demographique-et-ses-effets-c0003
    concept_id: "croissance-population-mondiale"
    reperes_level: "5eme"
    priority: "essentiel"
    type: "basic"
    front: "Pourquoi est-il faux d'affirmer que la population mondiale diminue alors que son taux de croissance annuel ralentit depuis les années 1960 ?"
    back: "Tant que le taux d'accroissement reste **positif** (environ \\(+0,8\\,\\%\\) par an), la population mondiale **continue d'augmenter**, simplement à un rythme moins rapide qu'auparavant."

  - id: c4-hg-la-croissance-demographique-et-ses-effets-c0004
    concept_id: "croissance-population-mondiale"
    reperes_level: "5eme"
    priority: "approfondissement"
    type: "basic"
    front: "Sur ce graphique de l'ONU, quel effectif de population mondiale (en milliards d'habitants) est projeté en **2100** dans le **scénario médian** (cible **`?`** sur la courbe rose) ?"
    back: "Environ **\\(10,18\\) milliards** (soit un peu plus de **\\(10\\) milliards** d'habitants)."
    explanation: "Le scénario médian de l'ONU prévoit un plafonnement de la population mondiale légèrement au-dessus de 10 milliards d'habitants vers la fin du XXIe siècle."
    asset_id: "evolution-population"
    asset_role: "front_occluded"
    occlusions:
      - id: "occ-proj-2100"
        x: 94.8
        y: 29.2
        w: 5.0
        h: 3.0

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "osarai"
version = "0.1.0"
description = "Plateforme statique libre de révisions du collège français et CLI déterministe de validation Content-as-Code"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Severin Ferrand" },
]
dependencies = [
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "markdown-it-py>=3.0,<4",
    "mdit-py-plugins>=0.4,<1",
    "pdfplumber>=0.11,<1",
    "pillow>=11.0,<12",
    "pydantic>=2.10,<3",
    "ruamel.yaml>=0.18,<1",
    "typer>=0.15,<1",
]

[project.urls]
Repository = "https://github.com/Seburan/osarai"

[project.scripts]
osarai = "osarai.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "respx>=0.22,<1",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/osarai"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src/osarai"]

[tool.coverage.report]
fail_under = 85
show_missing = true

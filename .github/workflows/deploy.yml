name: Déploiement GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Validation et compilation du portail statique
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@v7

      - name: Installation de uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Configuration de GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Synchronisation verrouillée de l'environnement Python
        run: uv sync --frozen

      - name: Validation hors-ligne des contenus et schémas
        run: uv run osarai validate

      - name: Compilation du portail statique dist/
        run: uv run osarai build-site --output dist --base-url "${{ steps.pages.outputs.base_path }}"

      - name: Téléversement de l'archive GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publication sur GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Attente de propagation de l'index d'artefacts GitHub
        run: sleep 10

      - name: Publication sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

